[package]
name = "keepass-bw-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Bidirectional KeePass2 <-> Bitwarden sync engine. Local .kdbx is the source of truth."
license = "MIT"
authors = ["Crud <crudobi@proton.me>"]
repository = "https://github.com/crudobi/keepass-bw-sync"
keywords = ["keepass", "bitwarden", "password-manager", "sync"]

[lib]
name = "keepass_bw_sync"
path = "src/lib.rs"

[[bin]]
name = "keepass-bw-sync"
path = "src/main.rs"

[dependencies]
keepass = { version = "0.15", features = ["save_kdbx4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
sha2 = "0.10"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
hex = "0.4"
